name: CI

# Every push runs the pure-logic test targets and the SwiftPM build. The
# Parakeet and polisher test targets need multi-gigabyte model files installed
# under Application Support, which a runner does not have — those suites run
# locally, and the benchmark consistency assertions run wherever the external
# SSD is mounted. Keeping the filter explicit beats a green checkmark that
# quietly skipped compilation.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build packages
        run: swift build

      - name: Run model-free test suites
        run: >
          swift test --filter
          "TextProcessingKitTests|AppCoreKitTests|ASRBenchmarkKitTests|FidelityKitTests"
