name: CI

# Every push runs the same fast gate a contributor runs locally: repository
# policy, formatting, every Swift unit test and the Python suites. The few
# tests that need multi-gigabyte model files under Application Support skip
# themselves (XCTSkipUnless) when the files are absent, so the whole suite can
# run here; the benchmark consistency assertions still run wherever the
# external SSD is mounted. A filtered run used to hide half the tests and a
# lint step that had been red for weeks.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Check repository policy
        run: ./Scripts/check-repository-policy.sh

      - name: Lint formatting
        run: >
          xcrun swift-format lint --strict --parallel --recursive
          Package.swift App Packages Tools Tests

      - name: Build packages
        run: swift build

      - name: Run Swift test suites
        run: swift test

      - name: Run Python test suites
        run: |
          python3 -m unittest discover -s Scripts -p 'test_*.py'
          python3 -m unittest discover -s Tools/benchmarks -p 'test_*.py'
